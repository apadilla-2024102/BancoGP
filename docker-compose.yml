version: '3.8'

services:
  # Databases
  postgres:
    image: postgres:13
    container_name: banco_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: banco_gp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - banco-network
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: banco_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: banco_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - banco-network
    restart: unless-stopped

  # .NET Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=postgres;Port=5432;User Id=admin;Password=admin123;Database=banco_gp;
    depends_on:
      - postgres
    networks:
      - banco-network
    restart: unless-stopped

  # Node.js Services
  customers-accounts-service:
    build:
      context: ./customers-accounts-service
      dockerfile: Dockerfile
    container_name: customers-accounts-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://admin:admin123@mongo:27017/banco_clientes?authSource=admin
      - NODE_ENV=development
      - JWT_SECRET=your-secret-key
      - AUTH_SERVICE_URL=http://auth-service:5000
    depends_on:
      - mongo
      - auth-service
    networks:
      - banco-network
    restart: unless-stopped

  transactions-service:
    build:
      context: ./transactions-service
      dockerfile: Dockerfile
    container_name: transactions-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGODB_URI=mongodb://admin:admin123@mongo:27017/banco_transacciones?authSource=admin
      - NODE_ENV=development
      - JWT_SECRET=your-secret-key
      - AUTH_SERVICE_URL=http://auth-service:5000
      - CUSTOMERS_SERVICE_URL=http://customers-accounts-service:3001
    depends_on:
      - mongo
      - auth-service
      - customers-accounts-service
    networks:
      - banco-network
    restart: unless-stopped

  financial-products-service:
    build:
      context: ./financial-products-service
      dockerfile: Dockerfile
    container_name: financial-products-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - MONGODB_URI=mongodb://admin:admin123@mongo:27017/banco_productos?authSource=admin
      - NODE_ENV=development
      - JWT_SECRET=your-secret-key
      - AUTH_SERVICE_URL=http://auth-service:5000
    depends_on:
      - mongo
      - auth-service
    networks:
      - banco-network
    restart: unless-stopped

  reports-notifications-service:
    build:
      context: ./reports-notifications-service
      dockerfile: Dockerfile
    container_name: reports-notifications-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - NODE_ENV=development
      - JWT_SECRET=your-secret-key
      - AUTH_SERVICE_URL=http://auth-service:5000
      - CUSTOMERS_SERVICE_URL=http://customers-accounts-service:3001
      - TRANSACTIONS_SERVICE_URL=http://transactions-service:3002
    depends_on:
      - auth-service
      - customers-accounts-service
      - transactions-service
    networks:
      - banco-network
    restart: unless-stopped

networks:
  banco-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
